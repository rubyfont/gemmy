<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="connect-src 'none'; script-src 'unsafe-inline' 'unsafe-eval' blob:; worker-src blob:;">
<title>runner</title>
</head>
<body>
<script>
var worker = null, workerErr = "";
function makeWorker(){
  try {
    if (worker) { worker.terminate(); worker = null; }
    var src = "self.onmessage = function(e){ var fn; try { fn = new Function('input', e.data.code); } catch (err) { self.postMessage({ ok:false, error:'compile: ' + err.message }); return; } try { var out = fn(e.data.input); self.postMessage({ ok:true, result: String(out) }); } catch (err) { self.postMessage({ ok:false, error: String((err && err.message) || err) }); } };";
    worker = new Worker(URL.createObjectURL(new Blob([src], { type: "text/javascript" })));
    worker.onmessage = function(e){ parent.postMessage({ type: "sbresult", data: e.data }, "*"); };
    worker.onerror = function(){ parent.postMessage({ type: "sbresult", data: { ok:false, error: "worker error" } }, "*"); };
  } catch (e) { worker = null; workerErr = String((e && e.message) || e); }
}
makeWorker();
addEventListener("message", function(e){
  var d = e.data || {};
  if (d.type === "sbping") { parent.postMessage({ type: "sbpong", workerOk: !!worker, workerErr: workerErr }, "*"); }
  if (d.type === "sbrun") { if (!worker) makeWorker(); if (worker) worker.postMessage({ code: d.code, input: d.input }); else parent.postMessage({ type: "sbresult", data: { ok:false, error: "no worker: " + workerErr } }, "*"); }
  if (d.type === "sbkill") { if (worker) { worker.terminate(); worker = null; } }
});
</script>
</body>
</html>
