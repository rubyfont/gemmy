<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ミュージックボール マイク用ページ</title>
<style>
  body { font-family: sans-serif; margin: 0; padding: 16px; background: #f7f3ea; color: #222; }
  h1 { font-size: 20px; margin: 4px 0 2px; }
  .env { color: #777; font-size: 12px; margin-bottom: 12px; }
  .card { background: #fff; border: 1px solid #ddd; border-radius: 10px; padding: 14px; margin-bottom: 14px; }
  .card h2 { font-size: 17px; margin: 0 0 8px; }
  button { font-size: 16px; padding: 12px 20px; border: none; border-radius: 8px; background: #2f5d3a; color: #fff; font-weight: bold; }
  button.sub { background: #666; }
  button:disabled { opacity: 0.45; }
  .big { font-size: 34px; font-weight: bold; text-align: center; margin: 10px 0; }
  .mid { font-size: 18px; text-align: center; }
  .msg { margin-top: 8px; font-size: 14px; }
  .bar { height: 14px; background: #eee; border-radius: 7px; overflow: hidden; margin: 8px 0; }
  .bar > div { height: 100%; width: 0%; background: #7bb661; transition: width 0.08s linear; }
  .cents { position: relative; height: 18px; background: linear-gradient(to right, #e8b4b4, #f7f3ea 50%, #b4d8e8); border-radius: 4px; margin: 8px 0; }
  .cents > div { position: absolute; top: 0; width: 4px; height: 18px; background: #c0392b; left: 50%; }
  .note { color: #555; font-size: 13px; }
</style>
</head>
<body>
<h1>🎵 ミュージックボール マイク用ページ</h1>
<div class="env" id="env"></div>

<div class="card" id="applauseCard" style="display:none">
  <h2>👏 拍手</h2>
  <div class="mid" id="songTitle"></div>
  <div class="big" id="clapCount">👏 ×0</div>
  <div class="bar"><div id="level"></div></div>
  <div style="text-align:center">
    <button id="clapStart">拍手をはじめる（5秒）</button>
  </div>
  <div class="msg" id="clapMsg"></div>
</div>

<div class="card">
  <h2>🎼 チューナー</h2>
  <div class="big" id="noteName">―</div>
  <div class="mid" id="freq">0.0 Hz</div>
  <div class="cents"><div id="centMark"></div></div>
  <div style="text-align:center">
    <button id="tunerStart">チューナーを開始</button>
    <button id="tunerStop" class="sub" disabled>停止</button>
  </div>
  <div class="msg" id="tunerMsg"></div>
</div>

<div class="note">このページはマイク専用です。終わったらゲームのタブに戻ってください。</div>

<script>
(function () {
  var qs = new URLSearchParams(location.search);
  var PERF = qs.get('perf') || '';
  var TITLE = qs.get('title') || '';
  var NAME = qs.get('name') || '';
  var API = qs.get('api') || '';

  function envText() {
    var ua = navigator.userAgent || '';
    var b = /CriOS\//.test(ua) ? 'Chrome' : /EdgiOS\/|Edg\//.test(ua) ? 'Edge' : /Chrome\//.test(ua) ? 'Chrome' : /Firefox\//.test(ua) || /FxiOS\//.test(ua) ? 'Firefox' : /Safari\//.test(ua) ? 'Safari' : 'ブラウザ';
    var os = /iPhone|iPad|iPod/.test(ua) ? 'iOS' : /Android/.test(ua) ? 'Android' : /Windows/.test(ua) ? 'Windows' : /Macintosh/.test(ua) ? 'macOS' : '';
    return b + (os ? ' / ' + os : '');
  }
  document.getElementById('env').textContent = envText();

  // ===== マイク共通 =====
  var mic = { stream: null, an: null, ac: null, buf: null, timer: null, mode: '' };
  function micStart(mode, cb) {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) { cb(false, 'api'); return; }
    navigator.mediaDevices.getUserMedia({ audio: true }).then(function (stream) {
      micStop();
      mic.stream = stream;
      mic.ac = mic.ac || new (window.AudioContext || window.webkitAudioContext)();
      if (mic.ac.state === 'suspended') mic.ac.resume();
      var src = mic.ac.createMediaStreamSource(stream);
      var an = mic.ac.createAnalyser(); an.fftSize = 2048;
      src.connect(an);
      mic.an = an; mic.buf = new Float32Array(an.fftSize); mic.mode = mode;
      mic.timer = setInterval(micTick, 80);
      cb(true);
    }, function (e) { cb(false, (e && e.name) || 'error'); });
  }
  function micStop() {
    if (mic.timer) { clearInterval(mic.timer); mic.timer = null; }
    if (mic.stream) { mic.stream.getTracks().forEach(function (t) { t.stop(); }); mic.stream = null; }
    mic.an = null; mic.mode = '';
    clap.on = false;
  }

  // ===== 拍手検出（適応しきい値：ふだんの音量から自動調整） =====
  var clap = { on: false, count: 0, base: 0, prevPeak: 0, lastMs: 0, sens: 0.5, levelEl: null, countEl: null };
  function clapTick(buf) {
    var peak = 0, i;
    for (i = 0; i < buf.length; i++) { var a = Math.abs(buf[i]); if (a > peak) peak = a; }
    if (clap.levelEl) clap.levelEl.style.width = Math.min(100, Math.round(peak * 100)) + '%';
    var sens = clap.sens;
    var trig = Math.min(0.9, Math.max(0.30 - 0.18 * sens, clap.base * (3.2 - 1.4 * sens)));
    var loud = 0.95 - 0.45 * sens;
    var now = Date.now();
    if (clap.on && (peak > trig || peak > loud) && clap.prevPeak <= Math.max(trig, 0.12) && now - clap.lastMs > 250) {
      clap.lastMs = now; clap.count++;
      if (clap.countEl) clap.countEl.textContent = '👏 ×' + clap.count;
    }
    clap.base = clap.base + (Math.min(peak, trig) - clap.base) * 0.06;
    clap.prevPeak = peak;
  }

  // ===== ピッチ検出（自己相関） =====
  function autoCorr(buf, sr) {
    var rms = 0, i, lag;
    for (i = 0; i < buf.length; i++) rms += buf[i] * buf[i];
    rms = Math.sqrt(rms / buf.length);
    if (rms < 0.012) return -1;
    var minP = Math.max(2, Math.floor(sr / 1200)), maxP = Math.min(Math.floor(buf.length / 2), Math.floor(sr / 50));
    var best = -1, bestCorr = 0;
    for (lag = minP; lag <= maxP; lag += 2) {
      var corr = 0;
      for (i = 0; i + lag < buf.length; i += 2) corr += buf[i] * buf[i + lag];
      if (corr > bestCorr) { bestCorr = corr; best = lag; }
    }
    if (best <= 0) return -1;
    var e0 = 0;
    for (i = 0; i + best < buf.length; i += 2) e0 += buf[i] * buf[i];
    if (e0 <= 0 || bestCorr < e0 * 0.55) return -1;
    return sr / best;
  }
  var NOTE_NAMES = ['C', 'C♯', 'D', 'D♯', 'E', 'F', 'F♯', 'G', 'G♯', 'A', 'A♯', 'B'];
  function tunerTick(buf) {
    var f = autoCorr(buf, mic.ac ? mic.ac.sampleRate : 44100);
    var nameEl = document.getElementById('noteName');
    var freqEl = document.getElementById('freq');
    var mark = document.getElementById('centMark');
    if (f <= 0) { nameEl.textContent = '―'; freqEl.textContent = '0.0 Hz'; return; }
    var mf = 69 + 12 * Math.log2(f / 440);
    var m = Math.round(mf);
    var cents = Math.round((mf - m) * 100);
    nameEl.textContent = NOTE_NAMES[((m % 12) + 12) % 12] + (Math.floor(m / 12) - 1);
    freqEl.textContent = f.toFixed(1) + ' Hz（' + (cents >= 0 ? '+' : '') + cents + ' セント）';
    mark.style.left = 'calc(' + Math.max(0, Math.min(100, 50 + cents)) + '% - 2px)';
  }

  function micTick() {
    if (!mic.an || !mic.buf) return;
    mic.an.getFloatTimeDomainData(mic.buf);
    if (mic.mode === 'clap') clapTick(mic.buf);
    else if (mic.mode === 'tuner') tunerTick(mic.buf);
  }

  // ===== サーバー連携 =====
  function apiGet(btn, cb) {
    var name = 'mbcb' + Date.now();
    var sc = document.createElement('script');
    window[name] = function (d) { cb(d); try { delete window[name]; sc.remove(); } catch (e) {} };
    sc.src = API + (API.indexOf('?') >= 0 ? '&' : '?') + 'mbapi=1&btn=' + encodeURIComponent(btn) + '&callback=' + name;
    sc.onerror = function () { cb({ error: '通信エラー' }); };
    document.body.appendChild(sc);
  }

  // ===== 拍手セクション =====
  var clapMsg = document.getElementById('clapMsg');
  if (PERF && API) {
    document.getElementById('applauseCard').style.display = '';
    document.getElementById('songTitle').textContent = '♪ ' + (TITLE || ('演奏 No.' + PERF));
    clap.levelEl = document.getElementById('level');
    clap.countEl = document.getElementById('clapCount');
    var startBtn = document.getElementById('clapStart');
    startBtn.onclick = function () {
      startBtn.disabled = true;
      clapMsg.textContent = 'マイクを開始しています…';
      micStart('clap', function (ok, why) {
        if (!ok) {
          clapMsg.textContent = why === 'api' ? 'このブラウザではマイクが使えません。' : 'マイクが使えませんでした（' + why + '）。ブラウザの許可をご確認ください。';
          startBtn.disabled = false;
          return;
        }
        clap.count = 0; clap.base = 0; clap.prevPeak = 0; clap.lastMs = 0; clap.on = true;
        clap.countEl.textContent = '👏 ×0';
        clapMsg.textContent = '拍手してください（5秒間）';
        var remain = 5;
        var iv = setInterval(function () {
          remain--;
          if (remain > 0) { clapMsg.textContent = '拍手してください（あと' + remain + '秒）'; return; }
          clearInterval(iv);
          clap.on = false;
          var n = clap.count;
          micStop();
          if (n <= 0) {
            clapMsg.textContent = '拍手が検出されませんでした。もう一度お試しください。';
            startBtn.disabled = false;
            return;
          }
          clapMsg.textContent = '拍手 ' + n + ' 回を送っています…';
          var sendDone = false;
          var sendTo = setTimeout(function () {
            if (sendDone) return; sendDone = true;
            clapMsg.textContent = '送信を確認できませんでした。通信環境をご確認のうえ、もう一度お試しください。';
            startBtn.disabled = false;
          }, 12000);
          apiGet('mb_clap\n' + PERF + '\n' + n, function (d) {
            if (sendDone) return; sendDone = true; clearTimeout(sendTo);
            if (d && d.ok) clapMsg.textContent = '👏 拍手 ' + n + ' 回を集計に加えています（合計 ' + d.claps + '）。ゲームに戻って確認できます。';
            else clapMsg.textContent = '送信できませんでした（' + (d && d.error ? d.error : '通信エラー') + '）。もう一度お試しください。';
            startBtn.disabled = false;
          });
        }, 1000);
      });
    };
  }

  // ===== チューナー =====
  var tStart = document.getElementById('tunerStart'), tStop = document.getElementById('tunerStop');
  var tMsg = document.getElementById('tunerMsg');
  tStart.onclick = function () {
    micStart('tuner', function (ok, why) {
      if (!ok) { tMsg.textContent = why === 'api' ? 'このブラウザではマイクが使えません。' : 'マイクが使えませんでした（' + why + '）。ブラウザの許可をご確認ください。'; return; }
      tMsg.textContent = '音を出すと、音名と周波数を表示します（A4=440Hz）';
      tStart.disabled = true; tStop.disabled = false;
    });
  };
  tStop.onclick = function () {
    micStop();
    tStart.disabled = false; tStop.disabled = true;
    document.getElementById('noteName').textContent = '―';
    document.getElementById('freq').textContent = '0.0 Hz';
  };
})();
</script>
</body>
</html>
