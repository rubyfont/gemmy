<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
</head>
<body>
  <div id="animwarn"></div>
  <div id="agent"></div>
  <div id="picker" style="display:none">
    <h1>🎲 ゲーム開発シート</h1>
    <p>遊ぶゲームを選んでください</p>
    <div id="gamelist">読み込み中…</div>
  </div>
  <div id="scriptgame" style="display:none">
    <div id="sgbar"><button class="sub" onclick="backToPicker()">← ゲーム選択</button><div id="sgpartybtns"></div><div id="sgtop"></div><button id="musicbtn" onclick="toggleMusic()">🔊 音楽ON</button></div>
    <div id="sgparty"></div>
    <h1 id="sgtitle">🎮 ゲーム</h1>
    <div id="sgmsg"></div>
    <canvas id="sgcv" width="800" height="720"></canvas>
    <div id="sgroll"></div>
    <div id="sgplayers"></div>
    <div id="sgbtns"></div>
    <div id="sgjoin">
      <div class="sgjoin-card" id="sgjoincard"></div>
    </div>
  </div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.17.0/dist/tf.min.js"></script>
<script>
  // 起動部（最小限）: ゲームエンジンと各ゲームのコードをシートから取得し、読み込み順に実行する。
  // 画面のhtmlタグと、この起動部だけをこのページに置き、画面の動作コードは
  // すべてゲーム管理シートのコードタブで管理する（AIゲーム設計規約 第20章）。
  function sgShowAnimWarning_(failed){
    var w = document.getElementById('animwarn');
    if (!w) return;
    if (failed && failed.length) {
      w.style.display = 'block';
      w.textContent = '⚠ アニメコードの「' + failed.join('」「') + '」を読み込めませんでした。シート「アニメコード」の内容を確認してください（そのアニメーションは動きません）。';
    } else {
      w.style.display = 'none';
    }
  }
  function sgInstallBlocks_(lib){
    lib = lib || {};
    var blocks = lib.blocks || {};
    var order = lib.order || Object.keys(blocks);
    var required = lib.required || {};
    var failed = [];
    order.forEach(function(name){
      var code = blocks[name];
      if (!code) { failed.push(name); return; }
      try {
        var sc = document.createElement('script');
        sc.textContent = code;
        document.body.appendChild(sc);
      } catch (e) {}
      var fn = required[name];
      if (fn && typeof window[fn] !== 'function') failed.push(name);
    });
    sgShowAnimWarning_(failed);
  }
  function sgBootFail_(){
    var box = document.getElementById('agent');
    if (box) box.innerHTML = '<p style="font-size:20px;padding:16px;">画面を読み込めませんでした。ページを開き直してください。</p>';
  }
  google.script.run.withSuccessHandler(function(lib){
    sgInstallBlocks_(lib || {});
    if (typeof window.sgEngineStart_ === 'function') window.sgEngineStart_();
    else sgBootFail_();
  }).withFailureHandler(function(){ sgShowAnimWarning_(['アニメコード全体']); sgBootFail_(); }).apiAnimCode();
</script>
</body>
</html>
