<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>手の検出テスト</title>
<style>
  body { margin: 0; font-family: sans-serif; background: #f7efdd; color: #333; text-align: center; }
  h1 { font-size: 22px; margin: 14px 0 6px; }
  #status { font-size: 19px; font-weight: bold; margin: 8px 12px; min-height: 28px; }
  #info { font-size: 17px; margin: 6px 12px 10px; line-height: 1.7; }
  #stage { position: relative; width: min(94vw, 640px); margin: 0 auto; }
  video, canvas { width: 100%; border-radius: 12px; display: block; }
  canvas { position: absolute; left: 0; top: 0; }
  .mirror { transform: scaleX(-1); }
  #startBtn { font-size: 20px; font-weight: bold; padding: 14px 34px; margin: 14px 0;
    border: none; border-radius: 999px; background: #e8873a; color: #fff; }
  #startBtn:disabled { background: #bbb; }
  #err { color: #b3261e; font-size: 15px; margin: 8px 12px; white-space: pre-wrap; }
  .note { font-size: 14px; color: #666; margin: 10px 12px 20px; }
</style>
</head>
<body>
<h1>手の検出テスト</h1>
<div id="status">読み込み中…</div>
<button id="startBtn" disabled>はじめる</button>
<div id="stage">
  <video id="cam" class="mirror" playsinline muted></video>
  <canvas id="draw" class="mirror"></canvas>
</div>
<div id="info">処理方式：―　速さ：―<br>検出した手：―</div>
<div id="err"></div>
<p class="note">映像はこの端末の中だけで処理され、外に送られることはありません。</p>

<script type="module">
import { FilesetResolver, HandLandmarker, DrawingUtils }
  from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs";

const statusEl = document.getElementById('status');
const infoEl = document.getElementById('info');
const errEl = document.getElementById('err');
const btn = document.getElementById('startBtn');
const video = document.getElementById('cam');
const canvas = document.getElementById('draw');
const ctx = canvas.getContext('2d');

let landmarker = null;
let delegateUsed = '―';
let frames = 0, fpsShown = '―', lastFpsTime = performance.now();
let lastVideoTime = -1;

function setStatus(t) { statusEl.textContent = t; }
function showInfo(handText) {
  infoEl.innerHTML = '処理方式：' + delegateUsed + '　速さ：' + fpsShown + '<br>検出した手：' + handText;
}

async function init() {
  try {
    const vision = await FilesetResolver.forVisionTasks(
      "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm");
    const options = (delegate) => ({
      baseOptions: {
        modelAssetPath: "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task",
        delegate: delegate
      },
      runningMode: "VIDEO",
      numHands: 2
    });
    try {
      landmarker = await HandLandmarker.createFromOptions(vision, options("GPU"));
      delegateUsed = 'GPU';
    } catch (e) {
      landmarker = await HandLandmarker.createFromOptions(vision, options("CPU"));
      delegateUsed = 'CPU';
    }
    setStatus('準備ができました。「はじめる」を押してください');
    btn.disabled = false;
    showInfo('―');
  } catch (e) {
    setStatus('読み込みに失敗しました');
    errEl.textContent = String(e && e.message || e);
  }
}

btn.addEventListener('click', async () => {
  btn.disabled = true;
  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: "user", width: { ideal: 1280 }, height: { ideal: 720 } },
      audio: false
    });
    video.srcObject = stream;
    await video.play();
    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;
    setStatus('検出中です。カメラに手をかざしてください');
    requestAnimationFrame(loop);
  } catch (e) {
    setStatus('カメラを開始できませんでした');
    errEl.textContent = String(e && e.message || e);
    btn.disabled = false;
  }
});

function loop() {
  requestAnimationFrame(loop);
  if (video.readyState < 2 || video.currentTime === lastVideoTime) return;
  lastVideoTime = video.currentTime;
  let result = null;
  try {
    result = landmarker.detectForVideo(video, performance.now());
  } catch (e) {
    setStatus('検出でエラーが起きました');
    errEl.textContent = String(e && e.message || e);
    return;
  }
  frames++;
  const now = performance.now();
  if (now - lastFpsTime >= 500) {
    fpsShown = Math.round(frames * 1000 / (now - lastFpsTime)) + ' FPS';
    frames = 0; lastFpsTime = now;
  }
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  let handText = 'なし';
  if (result && result.landmarks && result.landmarks.length) {
    const du = new DrawingUtils(ctx);
    const names = [];
    for (let i = 0; i < result.landmarks.length; i++) {
      du.drawConnectors(result.landmarks[i], HandLandmarker.HAND_CONNECTIONS,
        { color: '#e8873a', lineWidth: 4 });
      du.drawLandmarks(result.landmarks[i], { color: '#2a7d4f', radius: 5 });
      const hd = result.handedness && result.handedness[i] && result.handedness[i][0];
      names.push(hd ? (hd.displayName === 'Left' ? '左手' : '右手') : '手');
    }
    handText = names.join('・');
  }
  showInfo(handText);
}

init();
</script>
</body>
</html>
